<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mise en Place"/>
<title>Mise en Place</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#faf7f2;font-family:'Fraunces',Georgia,serif;color:#1a1208}
input,select,textarea,button{font-family:inherit}
header{padding:28px 20px 0;max-width:780px;margin:0 auto}
main{max-width:780px;margin:0 auto;padding:20px 20px 80px}
h1{font-size:2rem;font-weight:800;letter-spacing:-0.02em;line-height:1}
.subtitle{font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;color:#a09070;margin-left:10px}
.tagline{color:#7a6a50;font-size:0.85rem;margin:6px 0 18px}
.ver{font-size:0.65rem;color:#c8a96e;margin-left:8px;font-family:'DM Mono',monospace}
.tabs{display:flex;gap:4px;background:#f0e8d8;border-radius:24px;padding:4px;width:fit-content;flex-wrap:wrap}
.tbtn{border:none;background:none;cursor:pointer;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;padding:7px 14px;border-radius:20px;color:#7a6a50;transition:all .2s;white-space:nowrap}
.tbtn.on{background:#1a1208;color:#faf7f2}
.badge{background:#c8a96e;color:white;border-radius:10px;padding:1px 7px;font-size:0.7rem;margin-left:4px;vertical-align:middle}
.card{background:#fff;border-radius:12px;border:1.5px solid #e8ddd0;padding:16px;transition:border-color .2s,background .2s}
.card.sel{border-color:#c8a96e;background:#fffbf4}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-title{font-size:0.92rem;font-weight:600;line-height:1.3;cursor:pointer;flex:1}
.card-actions{display:flex;gap:2px;flex-shrink:0;margin-left:4px}
.icon-btn{border:none;background:none;cursor:pointer;font-size:0.8rem;color:#a09070;padding:2px 5px}
.fav-btn{border:none;background:none;cursor:pointer;font-size:1rem;padding:2px 5px;line-height:1}
.card-meta{font-size:0.73rem;color:#7a6a50;font-family:'DM Mono',monospace;margin-bottom:6px}
.card-preview{font-size:0.71rem;color:#a09070;margin-bottom:12px;line-height:1.6}
.sel-btn{width:100%;border:1.5px solid #e0d5c5;background:white;color:#7a6a50;border-radius:8px;padding:6px 0;font-size:0.78rem;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.sel-btn.on{border-color:#c8a96e;background:#c8a96e;color:white}
.add-card{border:1.5px dashed #c8a96e;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;color:#c8a96e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.btnp{background:#1a1208;color:#faf7f2;border:none;border-radius:8px;padding:10px 20px;font-size:0.85rem;cursor:pointer;letter-spacing:.04em;white-space:nowrap}
.btnp:disabled{opacity:.35;cursor:default}
.btng{background:none;border:1.5px solid #e0d5c5;border-radius:8px;padding:8px 16px;font-size:0.82rem;cursor:pointer;color:#7a6a50}
.cta{display:flex;justify-content:center;gap:10px;margin-top:10px}
.aibox{border:1.5px dashed #c8a96e;border-radius:12px;padding:16px;background:#fffbf4;margin-bottom:22px}
.stitle{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:#a09070;margin-bottom:10px}
.itabs{display:flex;background:#f0e8d8;border-radius:8px;padding:3px;width:fit-content;margin-bottom:14px}
.itab{border:none;border-radius:6px;padding:6px 14px;font-size:0.78rem;cursor:pointer;color:#7a6a50;background:none}
.itab.on{background:white;color:#1a1208;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.url-row{display:flex;gap:8px}
.url-inp{flex:1;border:1px solid #e0d5c5;border-radius:8px;padding:8px 12px;font-family:'DM Mono',monospace;font-size:0.8rem;background:#faf7f2;color:#1a1208;min-width:0}
.url-inp:focus{outline:none;border-color:#c8a96e}
.hint{font-size:0.72rem;color:#a09070;margin-top:6px;font-family:'DM Mono',monospace;line-height:1.5}
textarea{width:100%;border:1px solid #e0d5c5;border-radius:8px;padding:10px;font-family:'DM Mono',monospace;font-size:0.78rem;background:#faf7f2;resize:vertical;min-height:80px;color:#1a1208}
textarea:focus{outline:none;border-color:#c8a96e}
.photo-lbl{display:block;position:relative;border:1.5px dashed #c8a96e;border-radius:10px;padding:22px 16px;text-align:center;cursor:pointer;overflow:hidden}
.photo-prev{display:flex;gap:12px;align-items:flex-start}
.photo-prev img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1.5px solid #e0d5c5;flex-shrink:0}
.tip{margin-top:10px;background:#f0e8d8;border-radius:8px;padding:10px 12px;font-size:0.72rem;color:#5a4a30;font-family:'DM Mono',monospace;line-height:1.7}
.err{color:#c0392b;font-size:0.78rem;margin-top:10px;font-family:'DM Mono',monospace}
.spin-row{display:flex;align-items:center;gap:8px;color:#a09070;font-size:0.78rem;font-family:'DM Mono',monospace;margin-top:10px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spinner{display:inline-block;animation:spin 1s linear infinite}
.summary{background:#fff;border:1.5px solid #e8ddd0;border-radius:12px;padding:16px;margin-bottom:18px}
.plan-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.plan-tag{background:#f0e8d8;border-radius:20px;padding:4px 12px;font-size:0.8rem;color:#5a4a30}
.divider{height:1px;background:#e8ddd0;margin:14px 0}
.stats{display:flex;gap:24px}
.stat-n{font-size:1.5rem;font-weight:700;color:#c8a96e}
.stat-l{font-size:0.7rem;color:#a09070;letter-spacing:.1em;text-transform:uppercase}
.pbar{height:4px;background:#e8ddd0;border-radius:2px;margin-top:10px;overflow:hidden}
.pfill{height:100%;background:#c8a96e;border-radius:2px;transition:width .4s}
.list-card{background:#fff;border:1.5px solid #e8ddd0;border-radius:12px;overflow:hidden;margin-bottom:16px}
.list-hdr{padding:12px 16px;border-bottom:1px solid #f0e8d8;display:flex;justify-content:space-between;align-items:center}
.sitem{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer}
.sitem:active{background:#f5efe4}
.sitem.chk{opacity:.45}
.cbox{width:20px;height:20px;border-radius:6px;border:2px solid #c8a96e;background:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sitem.chk .cbox{background:#c8a96e;border-color:#c8a96e}
.iname{font-size:0.95rem}
.sitem.chk .iname{text-decoration:line-through}
.qbadge{font-family:'DM Mono',monospace;font-size:0.88rem;font-weight:500;color:#c8a96e;margin-left:8px}
.rtag{font-size:0.62rem;color:#a09070;margin-left:3px;font-style:italic}
.srcs{font-size:0.72rem;color:#a09070;font-family:'DM Mono',monospace;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(26,18,8,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#faf7f2;border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal h2{font-size:1.15rem;font-weight:700;margin-bottom:16px}
.modal-name{width:100%;border:1.5px solid #e0d5c5;border-radius:8px;padding:8px 12px;font-size:0.95rem;margin-bottom:16px;background:#faf7f2;font-family:'Fraunces',Georgia,serif}
.irow{display:grid;grid-template-columns:1fr 64px 84px 28px;gap:6px;align-items:center;margin-bottom:6px}
.ii{border:1px solid #e0d5c5;border-radius:6px;padding:6px 8px;font-family:'DM Mono',monospace;font-size:0.78rem;background:#faf7f2;color:#1a1208;width:100%}
.mbtns{display:flex;gap:10px;margin-top:4px}
.mbtns .btng,.mbtns .btnp{flex:1;text-align:center}
.empty{text-align:center;padding:60px 20px;color:#a09070}
.fav-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f0e8d8;cursor:pointer;transition:background .1s}
.fav-row:last-child{border-bottom:none}
.fav-row:active{background:#f5efe4}
.fav-info{flex:1}
.fav-name{font-size:0.92rem;font-weight:600}
.fav-meta{font-size:0.72rem;color:#a09070;font-family:'DM Mono',monospace;margin-top:2px}
.fav-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:12px}
.add-plan-btn{border:1.5px solid #c8a96e;background:white;color:#c8a96e;border-radius:20px;padding:4px 12px;font-size:0.75rem;cursor:pointer;white-space:nowrap;transition:all .2s}
.add-plan-btn.on{background:#c8a96e;color:white}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
'use strict';
var e=React.createElement,useState=React.useState,useEffect=React.useEffect;

var UG={
  volume:{units:["tsp","tbsp","fl oz","cup","pint","quart","gallon","ml","l"],
    toBase:{tsp:1,tbsp:3,"fl oz":6,cup:48,pint:96,quart:192,gallon:768,ml:0.202884,l:202.884},
    fromBase:function(v){
      if(v>=768)return[v/768,"gallon"];if(v>=192)return[v/192,"quart"];
      if(v>=96)return[v/96,"pint"];if(v>=48)return[v/48,"cup"];
      if(v>=3)return[v/3,"tbsp"];return[v,"tsp"];}},
  weight:{units:["g","kg","oz","lb"],
    toBase:{g:1,kg:1000,oz:28.3495,lb:453.592},
    fromBase:function(v){
      if(v>=453.592)return[v/453.592,"lb"];if(v>=28.3495)return[v/28.3495,"oz"];
      if(v>=100)return[v/1000,"kg"];return[v,"g"];}}
};
var MKT={lb:[.25,.5,.75,1,1.25,1.5,1.75,2,2.5,3,4,5],oz:[1,2,3,4,6,8,10,12,16],
  kg:[.25,.5,.75,1,1.5,2,2.5,3],g:[50,100,150,200,250,300,400,500,750,1000],
  cup:[.25,.33,.5,.67,.75,1,1.25,1.5,1.75,2,2.5,3,4],tbsp:[1,1.5,2,3,4,6,8],
  tsp:[.25,.5,.75,1,1.5,2,3,4],"fl oz":[1,2,4,6,8,12,16,32],
  pint:[.5,1,1.5,2],quart:[.5,1,1.5,2],l:[.25,.5,.75,1,1.5,2],
  ml:[50,100,150,200,250,300,500,750,1000]};

function msnap(qty,unit){
  var s=MKT[unit];if(!s)return{qty:qty,unit:unit,rounded:false};
  var v=s.find(function(x){return x>=qty-.01;});
  if(!v){var c=Math.ceil(qty*2)/2;return{qty:c,unit:unit,rounded:c!==qty};}
  return{qty:v,unit:unit,rounded:Math.abs(v-qty)>.01};
}
// Prep words to strip from ingredient names
var PREP_WORDS=/\b(fresh|dried|ground|minced|pressed|chopped|sliced|diced|crushed|grated|shredded|torn|coarsely|finely|thinly|small|medium|large|extra|virgin|whole|peeled|boneless|skinless|cooked|raw|frozen|thawed|rinsed|drained|packed|heaping|rounded|scant|about|approximately|such as|or similar|or other|with their juices|cut into [^,]+|broken in half|[0-9]+[-%]\s*protein|[0-9]+\/[0-9]+)\b/gi;
// Ingredient aliases — maps variations to a canonical name
var ALIASES={
  'scallion':'scallion','green onion':'scallion','spring onion':'scallion',
  'yellow onion':'onion','white onion':'onion','sweet onion':'onion','red onion':'red onion',
  'garlic clove':'garlic','garlic cloves':'garlic',
  'red pepper flake':'red pepper flake','red-pepper flake':'red pepper flake',
  'red chili flake':'red pepper flake','chili flake':'red pepper flake',
  'parm':'parmesan','parmigiano':'parmesan','parmigiano reggiano':'parmesan',
  'aged parmesan':'parmesan','grated parmesan':'parmesan','parmesan cheese':'parmesan',
  'basil leave':'basil','fresh basil':'basil',
  'canned crushed tomato':'crushed tomato','crushed tomato':'crushed tomato',
  'whole peeled tomato':'whole peeled tomato','crushed or strained tomato':'crushed tomato',
  'strained tomato':'crushed tomato',
  'extra virgin olive oil':'olive oil','extra-virgin olive oil':'olive oil',
  'hot italian sausage':'italian sausage','bulk hot or mild italian sausage':'italian sausage',
  'hot italian pork sausage':'italian sausage','italian pork sausage':'italian sausage',
  'kosher salt':'salt','sea salt':'salt','coarse salt':'salt','table salt':'salt',
  '80/20 ground chuck':'ground beef','ground chuck':'ground beef',
  'whole milk ricotta':'ricotta','ricotta cheese':'ricotta',
  'fresh mozzarella':'mozzarella','mozzarella cheese':'mozzarella',
};
function nkey(n){
  var s=n.toLowerCase().trim();
  // Strip prep words and notes in parentheses
  s=s.replace(/\([^)]*\)/g,'').replace(PREP_WORDS,' ').replace(/\s+/g,' ').trim();
  // Remove trailing 's' for basic pluralization
  s=s.replace(/s$/,'');
  // Check aliases
  if(ALIASES[s])return ALIASES[s];
  // Check if any alias key is contained in s
  var keys=Object.keys(ALIASES);
  for(var i=0;i<keys.length;i++){
    if(s===keys[i]||s===keys[i].replace(/s$/,''))return ALIASES[keys[i]];
  }
  return s;
}

// Density table: grams per tsp for common ingredients
// Used to convert between weight and volume units
var DENSITY={
  // Spices & dried herbs (g per tsp)
  'salt':6,'kosher salt':4,'sea salt':5,'coarse salt':4,
  'sugar':4,'granulated sugar':4,'brown sugar':4,'powdered sugar':3,'confectioners sugar':3,
  'flour':2.6,'all purpose flour':2.6,'bread flour':2.7,'cornstarch':2.5,'cornmeal':4,
  'baking soda':6,'baking powder':4,'cocoa powder':2.5,'cocoa':2.5,
  'black pepper':2.3,'white pepper':2.4,'cayenne':2,'paprika':2.3,'smoked paprika':2.3,
  'cumin':2.1,'coriander':1.8,'turmeric':3,'cinnamon':2.6,'nutmeg':2.3,
  'oregano':1,'dried oregano':1,'thyme':1,'dried thyme':1,
  'basil':1.2,'dried basil':1.2,'rosemary':1.2,'dried rosemary':1.2,
  'chili flake':1.8,'red chili flake':1.8,'red pepper flake':1.8,'chili powder':2.5,
  'garlic powder':3,'onion powder':2.5,'mustard powder':2,'curry powder':2.5,
  'cardamom':2,'clove':2.1,'allspice':2,'ginger':1.8,'dried ginger':1.8,
  // Fats & liquids (g per tsp)
  'butter':4.7,'olive oil':4.5,'vegetable oil':4.5,'coconut oil':4.5,
  'sesame oil':4.5,'canola oil':4.5,
  // Sauces & pastes (g per tsp)
  'tomato paste':5.4,'miso':6,'soy sauce':6,'fish sauce':5.6,
  'honey':7,'maple syrup':6.7,'vanilla extract':4.2,
  // Other
  'yeast':3,'instant yeast':3,'active dry yeast':3,
};

// g per tsp -> convert grams to tsp base
function gToTsp(grams, ingredientName){
  var k=nkey(ingredientName);
  var density=null;
  // exact match first
  if(DENSITY[k])density=DENSITY[k];
  // partial match
  if(!density){
    var keys=Object.keys(DENSITY);
    for(var i=0;i<keys.length;i++){
      if(k.indexOf(keys[i])!==-1||keys[i].indexOf(k)!==-1){density=DENSITY[keys[i]];break;}
    }
  }
  if(!density)return null; // unknown ingredient, can't convert
  return grams/density; // tsp
}

// Ingredients to exclude entirely from the shopping list
var EXCLUDE=['water','warm water','cold water','ice water','boiling water'];

// Pantry staples — shown in a separate check section, no quantities
var PANTRY=[
  // Oils & fats
  'vegetable oil','canola oil','coconut oil',
  'sesame oil','avocado oil','neutral oil','cooking oil','butter','ghee',
  // Vinegars
  'vinegar','white vinegar','red wine vinegar','white wine vinegar','apple cider vinegar',
  'balsamic vinegar','rice vinegar','sherry vinegar',
  // Salt & sugar
  'salt','kosher salt','sea salt','coarse salt','flaky salt','table salt',
  'sugar','granulated sugar','brown sugar','powdered sugar','confectioners sugar',
  // Flour & starches
  'flour','all purpose flour','bread flour','cake flour','cornstarch','arrowroot',
  'baking soda','baking powder',
  // Dried spices & herbs
  'black pepper','white pepper','red pepper flake','chili flake','cayenne',
  'paprika','smoked paprika','cumin','coriander','turmeric','cinnamon','nutmeg',
  'oregano','dried oregano','thyme','dried thyme','basil','dried basil',
  'rosemary','dried rosemary','bay leaf','bay leaves','chili powder','curry powder',
  'garlic powder','onion powder','mustard powder','cardamom','clove','allspice',
  'ginger','dried ginger','vanilla extract','red chili flake',
  // Condiments & sauces
  'soy sauce','fish sauce','worcestershire','worcestershire sauce',
  'hot sauce','sriracha','tabasco','oyster sauce','hoisin sauce',
  'dijon mustard','mustard','ketchup','mayonnaise',
  'honey','maple syrup','molasses',
  // Stocks & pastes
  'better than bouillon','beef better than bouillon','chicken better than bouillon',
  'tomato paste','miso','miso paste',
  // Dry goods
  'yeast','instant yeast','active dry yeast',
  'cocoa powder','cocoa','chocolate chips',
  'dried pasta','pasta',
];

function isPantry(name){
  var n=nkey(name);
  return PANTRY.some(function(p){return n===nkey(p)||n.indexOf(nkey(p))!==-1||nkey(p).indexOf(n)!==-1;});
}
function isExcluded(name){
  var n=nkey(name);
  return EXCLUDE.some(function(x){return n===nkey(x)||n.indexOf(nkey(x))!==-1;});
}

// Ingredients that should always be countable (no volume/weight unit)
var COUNTABLE=['can','jar','package','tin','box','bag','bottle',
  'bay leaf','bay leave',
  'bread','baguette','loaf','roll','bun','bagel','tortilla','pita',
  'egg','onion','shallot','garlic','clove','lemon','lime','orange','apple',
  'tomato','potato','carrot','pepper','chili','chile','avocado','zucchini',
  'cucumber','eggplant','beetroot','turnip','radish','scallion','leek',
  'banana','peach','plum','mango','chicken','breast','thigh','fillet',
  'sausage','link','strip','slice','piece','can','jar','package','head',
  'stalk','sprig','bunch','stick'];

function shouldBeCountable(name){
  var n=nkey(name);
  return COUNTABLE.some(function(c){return n.indexOf(c)!==-1;});
}
function consolidate(recipes){
  var map={};
  recipes.forEach(function(r){
    r.ingredients.forEach(function(ing){
      var k=nkey(ing.name);
      if(!map[k])map[k]={name:ing.name,entries:[]};
      map[k].entries.push({qty:ing.qty,unit:ing.unit,recipe:r.name});
    });
  });
  return Object.values(map).filter(function(item){
    return !isExcluded(item.name);
  }).map(function(item){
    var units=item.entries.map(function(x){return x.unit;}).filter(Boolean);
    var cons=null;
    // Force countable treatment for bread, eggs, onions etc
    if(shouldBeCountable(item.name)){
      var tot0=item.entries.reduce(function(s,x){return s+(x.qty||0);},0);
      if(tot0>0){var r0=Math.ceil(tot0);cons={qty:r0,unit:'',rounded:r0!==tot0,exact:+tot0.toFixed(2)};}
    }
    // Try mixed volume+weight consolidation via density table
    var hasVol=units.some(function(u){return UG.volume.units.includes(u);});
    var hasWgt=units.some(function(u){return UG.weight.units.includes(u);});
    if(!cons&&hasVol&&hasWgt){
      // Convert everything to tsp base
      var tspTotal=0,ok=true;
      item.entries.forEach(function(x){
        if(!x.unit){tspTotal+=(x.qty||0);return;}
        if(UG.volume.units.includes(x.unit)){
          tspTotal+=(x.qty||0)*(UG.volume.toBase[x.unit]||1);
        } else if(UG.weight.units.includes(x.unit)){
          var grams=(x.qty||0)*(UG.weight.toBase[x.unit]||1);
          var tsp=gToTsp(grams,item.name);
          if(tsp===null){ok=false;}else{tspTotal+=tsp;}
        }
      });
      if(ok&&tspTotal>0){
        var fb2=UG.volume.fromBase(tspTotal);
        var sv3=msnap(fb2[0],fb2[1]);
        cons={qty:sv3.qty,unit:sv3.unit,rounded:sv3.rounded,exact:+fb2[0].toFixed(2),mixed:true};
      }
    }
    var ents=Object.entries(UG);
    for(var i=0;i<ents.length&&!cons;i++){
      var g=ents[i][1];
      if(units.every(function(u){return g.units.includes(u);})){
        var base=item.entries.reduce(function(s,x){return s+(x.qty||0)*(x.unit?g.toBase[x.unit]||1:1);},0);
        var fb=g.fromBase(base);var exact=fb[0],unit=fb[1];
        var sv=msnap(exact,unit);
        cons={qty:sv.qty,unit:sv.unit,rounded:sv.rounded,exact:+exact.toFixed(2)};break;
      }
    }
    if(!cons&&units.length>0&&units.every(function(u){return u===units[0];})){
      var tot=item.entries.reduce(function(s,x){return s+(x.qty||0);},0);
      var sv2=msnap(tot,units[0]);
      cons={qty:sv2.qty,unit:sv2.unit,rounded:sv2.rounded,exact:+tot.toFixed(2)};
    }
    // Countable items (no unit) — round up to nearest whole number
    if(!cons&&units.length===0){
      var tot2=item.entries.reduce(function(s,x){return s+(x.qty||0);},0);
      if(tot2>0){
        var rounded2=Math.ceil(tot2);
        cons={qty:rounded2,unit:'',rounded:rounded2!==tot2,exact:+tot2.toFixed(2)};
      }
    }
    // If entries have qty but no unit and item isn't countable, assume grams
    item.entries=item.entries.map(function(x){
      if(x.qty&&Number(x.qty)>0&&!x.unit&&!shouldBeCountable(item.name)){
        return Object.assign({},x,{unit:'g'});
      }
      return x;
    });
    var pantry=isPantry(item.name);
    var hasQty=item.entries.some(function(x){return x.qty!==null&&x.qty!==''&&x.qty!==undefined&&Number(x.qty)>0;});
    var optional=!hasQty;
    return{name:item.name,consolidated:cons,entries:item.entries,pantry:pantry,optional:optional};
  });
}
function fmtQ(n){
  if(!n&&n!==0)return"";
  var F=[[1/4,"\u00bc"],[1/3,"\u2153"],[1/2,"\u00bd"],[2/3,"\u2154"],[3/4,"\u00be"]];
  var w=Math.floor(n),r=n-w,f="";
  for(var i=0;i<F.length;i++)if(Math.abs(r-F[i][0])<.05){f=F[i][1];break;}
  if(f)return w?w+f:f;
  return n%1===0?String(n):n.toFixed(2).replace(/\.?0+$/,"");
}

        pantryUniq.map(function(name,i){return renderPantryItem(name,i);})
      ):null,
      optionalItems.length>0?e('div',{className:'list-card',style:{marginTop:12}},
        e('div',{className:'list-hdr'},
          e('div',null,
            e('div',{className:'stitle',style:{marginBottom:0}},'Optional'),
            e('p',{style:{fontSize:'0.7rem',color:'#a09070',fontFamily:"'DM Mono',monospace",marginTop:2}},'Garnish and other items without quantities')
          )
        ),
        optionalItems.map(function(item,i){
          var k='o_'+nkey(item.name),chk=checked.has(k);
          return e('div',{key:i,className:'sitem'+(chk?' chk':''),onClick:function(){togChk(k);}},
            e('div',{className:'cbox'},chk?e(Checkmark):null),
            e('div',{style:{flex:1}},
              e('span',{className:'iname'},item.name),
              e('div',{className:'srcs'},
                item.entries.map(function(x,j){
                  return e('span',{key:j},(j>0?' · ':'')+x.recipe);
                })
              )
            )
          );
        })
      ):null,
      e('div',{className:'cta'},
        e('button',{className:'btng',onClick:function(){setView('plan');}},'\u2190 Edit plan'),
        e('button',{className:'btnp',onClick:function(){
          var t=cons.map(function(i){return '\u2022 '+i.name+(i.consolidated?' \u2014 '+fmtQ(i.consolidated.qty)+(i.consolidated.unit?' '+i.consolidated.unit:''):'');}).join('\n');
          if(navigator.clipboard)navigator.clipboard.writeText(t);
        }},'Copy List')
      )
    );
  }

  var mainContent;
  if(view==='plan') mainContent=renderPlan();
  else if(view==='favs') mainContent=renderFavs();
  else mainContent=renderList();

  return e('div',null,
    e('header',null,
      e('div',{style:{display:'flex',alignItems:'baseline'}},
        e('h1',null,'mise en place'),
        e('span',{className:'subtitle'},'meal planner')
      ),
      e('p',{className:'tagline'},'Plan your week. Consolidate ingredients. Waste less.',e('span',{className:'ver'},'v22')),
      e('div',{className:'tabs'},
        e('button',{className:'tbtn'+(view==='plan'?' on':''),onClick:function(){setView('plan');}},'Recipes'),
        e('button',{className:'tbtn'+(view==='favs'?' on':''),onClick:function(){setView('favs');}},
          '\u2605 Favorites',favs.length>0?e('span',{className:'badge'},favs.length):null),
        e('button',{className:'tbtn'+(view==='list'?' on':''),onClick:function(){setView('list');}},
          'Shopping List',selected.size>0?e('span',{className:'badge'},selected.size):null)
      )
    ),
    e('main',null,mainContent),
    editId&&editRec?e('div',{className:'overlay',onClick:function(){setEditId(null);}},
      e('div',{className:'modal',onClick:function(ev){ev.stopPropagation();}},
        e('h2',null,'Edit Recipe'),
        e('input',{className:'modal-name',value:editRec.name,placeholder:'Recipe name',
          onChange:function(ev){setEditRec(function(r){return Object.assign({},r,{name:ev.target.value});});}}),
        e('div',{className:'stitle'},'Ingredients'),
        e(IngRows,{ings:editRec.ingredients,
          onChange:function(i,f,v){iChange(setEditRec,i,f,v);},
          onAdd:function(){iAdd(setEditRec);},
          onRemove:function(i){iRem(setEditRec,i);}}),
        e('div',{className:'mbtns'},
          e('button',{className:'btng',onClick:function(){setEditId(null);}},'Cancel'),
          e('button',{className:'btnp',onClick:saveEdit},'Save')
        )
      )
    ):null,
    showNew?e('div',{className:'overlay',onClick:function(){setShowNew(false);}},
      e('div',{className:'modal',onClick:function(ev){ev.stopPropagation();}},
        e('h2',null,'New Recipe'),
        e('input',{className:'modal-name',value:newRec.name,placeholder:'Recipe name',autoFocus:true,
          onChange:function(ev){setNewRec(function(r){return Object.assign({},r,{name:ev.target.value});});}}),
        e('div',{className:'stitle'},'Ingredients'),
        e(IngRows,{ings:newRec.ingredients,
          onChange:function(i,f,v){iChange(setNewRec,i,f,v);},
          onAdd:function(){iAdd(setNewRec);},
          onRemove:function(i){iRem(setNewRec,i);}}),
        e('div',{className:'mbtns'},
          e('button',{className:'btng',onClick:function(){setShowNew(false);}},'Cancel'),
          e('button',{className:'btnp',onClick:saveNew},'Add Recipe')
        )
      )
    ):null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
</body>
</html>
